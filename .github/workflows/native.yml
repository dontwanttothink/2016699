# Builds the CLI application into a native executable with GraalVM Native Image
# on each supported platform and uploads the binaries as workflow artifacts.
#
# GraalVM cannot cross-compile.

name: Native binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            binary: graduation
          - target: linux-arm64
            os: ubuntu-24.04-arm
            binary: graduation
          - target: macos-arm64
            os: macos-latest
            binary: graduation
          - target: windows-x86_64
            os: windows-latest
            binary: graduation.exe

    steps:
    - uses: actions/checkout@v7

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm-community'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build native executable
      run: ./gradlew :app:nativeCompile

    - name: Smoke test native executable
      run: app/build/native/nativeCompile/${{ matrix.binary }} --help

    - name: Upload native executable
      uses: actions/upload-artifact@v7
      with:
        name: graduation-${{ matrix.target }}
        path: app/build/native/nativeCompile/${{ matrix.binary }}
        if-no-files-found: error
